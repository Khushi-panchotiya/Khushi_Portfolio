<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Priority Scheduler</title>
<style>
  :root{
    --paper:#faf8f2;
    --line:#d9e2ec;
    --margin:#e8b4b8;
    --ink:#2b2b2b;
    --faint:#8a8a8a;
    --accent:#3d5a80;
    --accent-soft:#e3e9f0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Segoe UI","Helvetica Neue",sans-serif;
    background:#efece3;
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:24px 12px 90px;
  }
  .sheet{
    width:100%;
    max-width:620px;
    background:var(--paper);
    border-radius:4px;
    box-shadow:0 10px 30px rgba(0,0,0,.12);
    background-image:
      linear-gradient(90deg,transparent 46px,var(--margin) 46px,var(--margin) 48px,transparent 48px),
      repeating-linear-gradient(var(--paper),var(--paper) 31px,var(--line) 31px,var(--line) 32px);
    padding:36px 34px 44px 64px;
    position:relative;
  }
  h1{
    font-weight:700;
    font-size:1.6rem;
    letter-spacing:.14em;
    text-transform:uppercase;
    margin-bottom:6px;
  }
  .sub{color:var(--faint);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;margin-bottom:22px}

  /* mood bar */
  .moods{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}
  .mood{
    border:1.5px solid var(--ink);
    background:transparent;
    border-radius:20px;
    padding:5px 14px;
    font-size:.82rem;
    cursor:pointer;
    letter-spacing:.04em;
    color:var(--ink);
    transition:.15s;
  }
  .mood:hover{background:var(--accent-soft)}
  .mood.active{background:var(--ink);color:var(--paper)}

  .mood-note{font-size:.85rem;color:var(--accent);margin-bottom:20px;min-height:1.1em;font-style:italic}

  /* task list */
  ul{list-style:none}
  li.task{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding:9px 0;
    border-bottom:1px dashed #cfc9ba;
  }
  li.task .idx{font-weight:700;color:var(--faint);min-width:20px}
  li.task .body{flex:1}
  li.task .name{font-size:1rem}
  li.task.done .name{text-decoration:line-through;color:var(--faint)}
  li.task .meta{font-size:.75rem;color:var(--faint);margin-top:2px;letter-spacing:.03em}
  li.task .tag{
    display:inline-block;border:1px solid #c9c2b2;border-radius:10px;
    padding:0 7px;margin-right:5px;font-size:.7rem
  }
  li.task .tag.hi{border-color:var(--accent);color:var(--accent)}
  li.task button.x,li.task button.pen{
    border:none;background:none;color:var(--faint);cursor:pointer;font-size:1rem;line-height:1;padding:2px
  }
  li.task button.pen:hover,li.task button.x:hover{color:var(--accent)}
  li.task .tools{display:flex;gap:2px}
  li.task input[type=checkbox]{margin-top:4px;accent-color:var(--accent);width:15px;height:15px;cursor:pointer}
  .empty{color:var(--faint);font-style:italic;padding:20px 0}

  /* add button */
  .fab{
    position:fixed;
    bottom:24px;left:50%;transform:translateX(-50%);
    width:56px;height:56px;border-radius:50%;
    background:var(--ink);color:var(--paper);
    border:none;font-size:1.8rem;line-height:1;
    cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.28);
  }
  .fab:hover{background:var(--accent)}

  /* add page */
  .page{display:none}
  .page.show{display:block}
  #home.show{display:block}
  label{display:block;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);margin:16px 0 6px}
  input[type=text],input[type=number]{
    width:100%;border:none;border-bottom:1.5px solid var(--ink);
    background:transparent;font-size:1rem;padding:6px 2px;font-family:inherit;color:var(--ink)
  }
  input:focus{outline:none;border-color:var(--accent)}
  .toggle-row{display:flex;gap:10px;margin-top:4px}
  .toggle-row button{
    flex:1;border:1.5px solid var(--ink);background:transparent;padding:8px;
    border-radius:4px;cursor:pointer;font-size:.85rem;color:var(--ink)
  }
  .toggle-row button.on{background:var(--ink);color:var(--paper)}
  .actions{display:flex;gap:12px;margin-top:32px}
  .actions button{
    flex:1;padding:12px;border-radius:4px;cursor:pointer;font-size:.9rem;letter-spacing:.06em;
  }
  .btn-save{border:none;background:var(--ink);color:var(--paper)}
  .btn-save:hover{background:var(--accent)}
  .btn-cancel{border:1.5px solid var(--ink);background:transparent;color:var(--ink)}
  .back{background:none;border:none;cursor:pointer;color:var(--accent);font-size:.85rem;margin-bottom:14px;letter-spacing:.05em}
</style>
</head>
<body>
<div class="sheet">

  <!-- ================= HOME ================= -->
  <section id="home" class="page show">
    <h1>Priority Scheduler</h1>
    <div class="sub">how are you feeling today?</div>

    <div class="moods" id="moodBar">
      <button class="mood" data-mood="happy">happy</button>
      <button class="mood" data-mood="sad">sad</button>
      <button class="mood" data-mood="lazy">lazy</button>
      <button class="mood" data-mood="tired">tired</button>
      <button class="mood" data-mood="stressed">stressed</button>
      <button class="mood" data-mood="unknown">I don't know</button>
    </div>
    <div class="mood-note" id="moodNote"></div>

    <ul id="taskList"></ul>
  </section>

  <!-- ================= ADD TASK ================= -->
  <section id="add" class="page">
    <button class="back" id="backBtn">&larr; back</button>
    <h1 id="addTitle">New Task</h1>
    <div class="sub">jot down what needs doing</div>

    <label>Task name</label>
    <input type="text" id="fName" placeholder="e.g. Finish report">

    <label>Priority</label>
    <div class="toggle-row" id="fPriority">
      <button data-v="1">High</button>
      <button data-v="0" class="on">Low</button>
    </div>

    <label>How long will it take? (minutes)</label>
    <input type="number" id="fLong" min="1" placeholder="30">

    <label>Need a break after?</label>
    <div class="toggle-row" id="fBreak">
      <button data-v="1">Yes</button>
      <button data-v="0" class="on">No</button>
    </div>

    <div class="actions">
      <button class="btn-cancel" id="cancelBtn">Cancel</button>
      <button class="btn-save" id="saveBtn">Save task</button>
    </div>
  </section>
</div>

<button class="fab" id="fab" title="Add task">+</button>

<script>
const mem = {};
const safe = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return k in mem ? mem[k] : null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; } }
};
const store = {
  get tasks(){ try{return JSON.parse(safe.get('ps_tasks'))||[]}catch(e){return[]} },
  set tasks(v){ safe.set('ps_tasks', JSON.stringify(v)) },
  get mood(){ return safe.get('ps_mood')||'' },
  set mood(v){ safe.set('ps_mood', v) }
};

const moodNotes = {
  happy:  "Good mood! Prioritising by importance, then the bigger tasks.",
  sad:    "Feeling down? Starting with tasks that earn you a break.",
  lazy:   "Feeling lazy? Easiest and shortest tasks first.",
  tired:  "Feeling tired? Short tasks first to conserve energy.",
  stressed:"Feeling stressed? Knocking out the high-priority items.",
  unknown:"Default order: shortest first, then priority."
};

function sortTasks(tasks, mood){
  const t = [...tasks];
  const by = {
    happy:   a=>[-a.priority, -a.how_long, a.need_break],
    sad:     a=>[-a.need_break, a.how_long, -a.priority],
    lazy:    a=>[a.how_long, -a.need_break, -a.priority],
    tired:   a=>[a.how_long, -a.need_break, a.priority],
    stressed:a=>[-a.priority, -a.need_break, a.how_long],
  }[mood] || (a=>[a.how_long, -a.priority, -a.need_break]);
  return t.sort((x,y)=>{
    const kx=by(x), ky=by(y);
    for(let i=0;i<kx.length;i++){ if(kx[i]!==ky[i]) return kx[i]-ky[i]; }
    return 0;
  });
}

/* ---------- render ---------- */
function render(){
  // moods
  document.querySelectorAll('.mood').forEach(b=>{
    b.classList.toggle('active', b.dataset.mood===store.mood);
  });
  document.getElementById('moodNote').textContent = store.mood ? moodNotes[store.mood] : '';

  // list
  const list = document.getElementById('taskList');
  const sorted = sortTasks(store.tasks, store.mood);
  // completed tasks always sink to the bottom
  const tasks = [...sorted.filter(t=>!t.done), ...sorted.filter(t=>t.done)];
  list.innerHTML = '';
  if(!tasks.length){
    list.innerHTML = '<li class="empty">No tasks yet. Tap + to add one.</li>';
    return;
  }
  tasks.forEach((task,i)=>{
    const li = document.createElement('li');
    li.className = 'task' + (task.done ? ' done' : '');
    li.innerHTML = `
      <input type="checkbox" ${task.done?'checked':''} data-id="${task.id}">
      <span class="idx">${i+1}.</span>
      <div class="body">
        <div class="name">${escapeHtml(task.name)}</div>
        <div class="meta">
          <span class="tag ${task.priority?'hi':''}">${task.priority?'High':'Low'} priority</span>
          <span class="tag">${task.how_long} min</span>
          <span class="tag">${task.need_break?'Break after':'No break'}</span>
        </div>
      </div>
      <div class="tools">
        <button class="pen" data-edit="${task.id}" title="Edit">&#9998;</button>
        <button class="x" data-del="${task.id}" title="Delete">&times;</button>
      </div>`;
    list.appendChild(li);
  });
}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

/* ---------- navigation ---------- */
function show(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));
  document.getElementById(id).classList.add('show');
  document.getElementById('fab').style.display = id==='home' ? 'block' : 'none';
  window.scrollTo(0,0);
}

/* ---------- events ---------- */
document.getElementById('moodBar').addEventListener('click',e=>{
  const b = e.target.closest('.mood'); if(!b) return;
  store.mood = (store.mood===b.dataset.mood) ? '' : b.dataset.mood;
  render();
});

let editingId = null;

document.getElementById('taskList').addEventListener('click',e=>{
  const del = e.target.closest('[data-del]');
  if(del){ store.tasks = store.tasks.filter(t=>t.id!=del.dataset.del); render(); return; }
  const ed = e.target.closest('[data-edit]');
  if(ed){
    const t = store.tasks.find(t=>t.id==ed.dataset.edit);
    if(!t) return;
    editingId = t.id;
    document.getElementById('addTitle').textContent = 'Edit Task';
    document.getElementById('fName').value = t.name;
    document.getElementById('fLong').value = t.how_long;
    setToggle('fPriority', String(t.priority));
    setToggle('fBreak', String(t.need_break));
    show('add');
  }
});
document.getElementById('taskList').addEventListener('change',e=>{
  const cb = e.target.closest('input[type=checkbox]'); if(!cb) return;
  const tasks = store.tasks;
  const t = tasks.find(t=>t.id==cb.dataset.id);
  if(t){ t.done = cb.checked; store.tasks = tasks; render(); }
});

document.getElementById('fab').addEventListener('click',()=>{
  editingId = null;
  document.getElementById('addTitle').textContent = 'New Task';
  resetForm(); show('add');
});
document.getElementById('backBtn').addEventListener('click',()=>{ editingId=null; show('home'); });
document.getElementById('cancelBtn').addEventListener('click',()=>{ editingId=null; show('home'); });

function bindToggle(groupId){
  document.getElementById(groupId).addEventListener('click',e=>{
    const b = e.target.closest('button'); if(!b) return;
    b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
  });
}
bindToggle('fPriority'); bindToggle('fBreak');

function resetForm(){
  document.getElementById('fName').value='';
  document.getElementById('fLong').value='';
  setToggle('fPriority','0'); setToggle('fBreak','0');
}
function setToggle(id,v){
  document.querySelectorAll('#'+id+' button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
}
function getToggle(id){ return document.querySelector('#'+id+' button.on').dataset.v; }

document.getElementById('saveBtn').addEventListener('click',()=>{
  const name = document.getElementById('fName').value.trim();
  const how_long = parseInt(document.getElementById('fLong').value,10);
  if(!name){ alert('Please enter a task name.'); return; }
  if(!how_long || how_long<1){ alert('Please enter how long it takes (minutes).'); return; }
  const tasks = store.tasks;
  const data = {
    name,
    priority: parseInt(getToggle('fPriority'),10),
    how_long,
    need_break: parseInt(getToggle('fBreak'),10)
  };
  if(editingId){
    const t = tasks.find(t=>t.id==editingId);
    if(t) Object.assign(t, data);
  } else {
    tasks.push(Object.assign({
      id: Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      done:false
    }, data));
  }
  store.tasks = tasks;
  editingId = null;
  show('home'); render();
});

render();
</script>
</body>
</html>
